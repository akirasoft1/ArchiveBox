apiVersion: v1
kind: Namespace
metadata:
  name: archivebox
---
apiVersion: v1
kind: Secret
metadata:
  name: archivebox-secrets
  namespace: archivebox
stringData:
  sonic_password: "SomeSecretPassword" # Change this in production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archivebox-data
  namespace: archivebox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonic-data
  namespace: archivebox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonic
  namespace: archivebox
  labels:
    app: sonic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonic
  template:
    metadata:
      labels:
        app: sonic
    spec:
      containers:
        - name: sonic
          image: archivebox/sonic:latest
          ports:
            - containerPort: 1491
          env:
            - name: SEARCH_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: archivebox-secrets
                  key: sonic_password
          volumeMounts:
            - name: sonic-data
              mountPath: /var/lib/sonic/store
      volumes:
        - name: sonic-data
          persistentVolumeClaim:
            claimName: sonic-data
---
apiVersion: v1
kind: Service
metadata:
  name: sonic
  namespace: archivebox
spec:
  selector:
    app: sonic
  ports:
    - protocol: TCP
      port: 1491
      targetPort: 1491
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivebox
  namespace: archivebox
  labels:
    app: archivebox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: archivebox
  template:
    metadata:
      labels:
        app: archivebox
    spec:
      initContainers:
        - name: archivebox-init
          image: mvilliger/archivebox:0.8.20
          args: ["archivebox", "init"]
          env:
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CSRF_TRUSTED_ORIGI
              value: "http://archive.aklabs.io"
            - name: SEARCH_BACKEND_ENGINE
              value: "sonic"
            - name: SEARCH_BACKEND_HOST_NAME
              value: "sonic"
            - name: SONIC_PORT
              value: "1491"
            - name: SEARCH_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: archivebox-secrets
                  key: sonic_password
          volumeMounts:
            - name: archivebox-data
              mountPath: /data
      containers:
        - name: archivebox
          image: mvilliger/archivebox:0.8.20
          ports:
            - containerPort: 8000
          env:
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CSRF_TRUSTED_ORIGI
              value: "http://archive.aklabs.io"
            - name: SEARCH_BACKEND_ENGINE
              value: "sonic"
            - name: SEARCH_BACKEND_HOST_NAME
              value: "sonic"
            - name: SONIC_PORT
              value: "1491"
            - name: SEARCH_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: archivebox-secrets
                  key: sonic_password
          volumeMounts:
            - name: archivebox-data
              mountPath: /data
      volumes:
        - name: archivebox-data
          persistentVolumeClaim:
            claimName: archivebox-data
---
apiVersion: v1
kind: Service
metadata:
  name: archivebox
  namespace: archivebox
spec:
  selector:
    app: archivebox
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archivebox-ingress
  namespace: archivebox
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: archive.aklabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: archivebox
                port:
                  number: 80
